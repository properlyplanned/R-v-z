<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Rɪ'vaiz</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container nav-wrap">

      <a href="index.html" class="brand">
        <span class="logo-box">R</span>

        <span>
          <strong>Rɪ'vaiz</strong>
          <small>Revise What Matters</small>
        </span>
      </a>

      <a href="index.html" class="back-home">
        ← Back to Home
      </a>

    </div>
  </header>


  <!-- Sign Up -->
  <main class="auth-page">

    <div class="auth-card">

      <div class="auth-heading">

        <span class="auth-icon">✦</span>

        <h1>Create your account</h1>

        <p>
          Start studying smarter and focus on what matters.
        </p>

      </div>


      <form class="auth-form" onsubmit="signUp(event)">

        <div class="form-group">

          <label for="name">
            Full name
          </label>

          <input
            type="text"
            id="name"
            placeholder="Your name"
            required
          >

        </div>


        <div class="form-group">

          <label for="signup-email">
            Email address
          </label>

          <input
            type="email"
            id="signup-email"
            placeholder="you@example.com"
            required
          >

        </div>


        <div class="form-group">

          <label for="signup-password">
            Password
          </label>

          <input
            type="password"
            id="signup-password"
            placeholder="Create a password"
            minlength="6"
            required
          >

        </div>


        <div class="form-group">

          <label for="confirm-password">
            Confirm password
          </label>

          <input
            type="password"
            id="confirm-password"
            placeholder="Confirm your password"
            minlength="6"
            required
          >

        </div>


        <label class="remember-row">

          <input
            type="checkbox"
            required
          >

          <span>
            I agree to the terms and conditions
          </span>

        </label>


        <button
          type="submit"
          class="auth-submit"
        >
          Create Account →
        </button>

      </form>


      <div class="auth-divider">
        <span>or</span>
      </div>


      <p class="auth-switch">

        Already have an account?

        <a href="signin.html">
          Sign in
        </a>

      </p>

    </div>

  </main>


  <!-- Footer -->
  <footer class="simple-footer">

    <p>
      © 2026 Rɪ'vaiz · Revise What Matters.
    </p>

  </footer>


  <script src="script.js"></script>

</body>
</html>
