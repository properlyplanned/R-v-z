<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Rɪ'vaiz</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container nav-wrap">

      <a href="index.html" class="brand">
        <span class="logo-box">R</span>
        <span>
          <strong>Rɪ'vaiz</strong>
          <small>Revise What Matters</small>
        </span>
      </a>

      <a href="index.html" class="back-home">← Back to Home</a>

    </div>
  </header>


  <!-- Sign In -->
  <main class="auth-page">

    <div class="auth-card">

      <div class="auth-heading">
        <span class="auth-icon">✦</span>
        <h1>Welcome back</h1>
        <p>Sign in to continue your smart revision journey.</p>
      </div>


      <form class="auth-form" onsubmit="signIn(event)">

        <div class="form-group">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            required
          >
        </div>


        <div class="form-group">
          <div class="label-row">
            <label for="password">Password</label>
            <a href="#">Forgot password?</a>
          </div>

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          >
        </div>


        <label class="remember-row">
          <input type="checkbox">
          <span>Remember me</span>
        </label>


        <button type="submit" class="auth-submit">
          Sign In →
        </button>

      </form>


      <div class="auth-divider">
        <span>or</span>
      </div>


      <p class="auth-switch">
        Don't have an account?
        <a href="signup.html">Create an account</a>
      </p>

    </div>

  </main>


  <footer class="simple-footer">
    <p>© 2026 Rɪ'vaiz · Revise What Matters.</p>
  </footer>


  <script src="script.js"></script>

</body>
</html>
